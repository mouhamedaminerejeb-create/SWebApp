<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dettaglio Match</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: green;
            padding: 20px;
        }

        .container { max-width: 700px; margin: 0 auto; }

        .match-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .match-header { text-align: center; margin-bottom: 20px; }

        .teams { font-size: 22px; font-weight: bold; }
        .score { font-size: 36px; font-weight: bold; margin: 10px 0; }
        .match-time { font-size: 14px; color: #666; }
        .status { margin-top: 5px; font-weight: bold; }

        .section { margin-top: 25px; }
        .section h3 { margin-bottom: 10px; border-bottom: 1px solid #eee; }

        .events { list-style: none; }
        .event-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            font-size: 14px;
        }

        .event-time { font-weight: bold; width: 40px; }
        .event-icon { width: 20px; text-align: center; }

        .actions { display: flex; justify-content: center; margin-top: 25px; }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            background: #6c757d;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="match-card">

        <div class="match-header">
            <div class="teams" id="teams">–</div>
            <div class="score" id="score">–</div>
            <div class="match-time" id="matchTime">–</div>
            <div class="status" id="status">–</div>
        </div>

        <div class="section">
            <h3>Eventi</h3>
            <ul class="events" id="eventList"></ul>
        </div>

        <div class="actions">
            <button onclick="window.history.back()">
                <i class="fa-solid fa-arrow-left"></i> Torna indietro
            </button>
        </div>

    </div>
</div>

<script>
const AUTO_REFRESH_INTERVAL = 1000;
let matchId = null;

function getMatchId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
}

function parseScore(scoreData) {
    let score = 0;
    let events = [];

    if (Array.isArray(scoreData)) {
        scoreData.forEach(item => {
            if (typeof item === "object") {
                const key = Object.keys(item)[0];
                score = parseInt(key);
                events.push({ time: item[key], type: "goal" });
            } else if (typeof item === "number") {
                score = item;
            }
        });
    } else {
        score = scoreData;
    }
    return { score, events };
}

async function loadMatch() {
    try {
        const res = await fetch("/api/matches");
        const data = await res.json();

        const match = data.items.find(m => String(m.id) === String(matchId));
        if (!match) return;

        const s1 = parseScore(match.scoreT1);
        const s2 = parseScore(match.scoreT2);

        document.getElementById("teams").textContent =
            `${match.team1_name} vs ${match.team2_name}`;

        document.getElementById("score").textContent =
            `${s1.score} - ${s2.score}`;

        document.getElementById("matchTime").textContent =
            `Tempo: ${match.time}'`;

        document.getElementById("status").textContent =
            match.done ? "TERMINATA" : "🔴 IN CORSO";

        const events = [];

        s1.events.forEach(e =>
            events.push({ time: e.time, text: `⚽ Gol ${match.team1_name}` })
        );
        s2.events.forEach(e =>
            events.push({ time: e.time, text: `⚽ Gol ${match.team2_name}` })
        );

        if (match.breaks) {
            match.breaks.forEach(b => {
                const type = Object.keys(b)[0];
                const time = b[type];
                events.push({
                    time,
                    text: type,
                    icon: type === "fallo" ? "📢" : "⏸️"
                });
            });
        }

        events.sort((a, b) => a.time - b.time);

        const list = document.getElementById("eventList");
        list.innerHTML = events.map(e => `
            <li class="event-item">
                <span class="event-time">${e.time}'</span>
                <span class="event-icon"><i class="fa-solid ${e.icon}"></i></span>
                ${e.text}
            </li>
        `).join("");

    } catch (err) {
        console.error("Errore caricamento match:", err);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    matchId = getMatchId();
    if (!matchId) return;
    loadMatch();
    setInterval(loadMatch, AUTO_REFRESH_INTERVAL);
});
</script>

</body>
</html>
